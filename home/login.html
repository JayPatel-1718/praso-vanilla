<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - PRASO</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f9f9f9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .login-container {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      width: 300px;
      text-align: center;
    }

    .login-container h2 {
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 15px;
      text-align: left;
    }

    .form-group input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
    }

    .form-group button {
      width: 100%;
      padding: 10px;
      background: #111;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    .form-group button:hover {
      background: #333;
    }

    .register-link {
      margin-top: 15px;
    }

    .register-link a {
      color: #ff4d4d;
      text-decoration: none;
    }

    /* Toast Notification */
    .toast-message {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #111;
      color: white;
      padding: 12px 20px;
      border-radius: 5px;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.3s ease, transform 0.3s ease;
      z-index: 9999;
    }

    .toast-message.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h2>Login</h2>
    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Enter your email" required />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password" required />
      </div>
      <div class="form-group">
        <button type="submit">Login</button>
      </div>
    </form>
    <div class="register-link">
      Don't have an account? <a href="register.html">Register here</a>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="toast-message"></div>

  <script type="module">
    // Import Firebase SDK
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    // Your Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyC4bDv-5EdzaVbMWd0TVmHLI4y7KIdR-6Q",
      authDomain: "prasoclothing-ac3a3.firebaseapp.com",
      projectId: "prasoclothing-ac3a3",
      storageBucket: "prasoclothing-ac3a3.appspot.com",
      messagingSenderId: "362254349990",
      appId: "1:362254349990:web:b3f89bd304f3468e92e667",
      measurementId: "G-ETY5MMFPPM",
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // Handle login form submission
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();

      try {
        // Sign in the user
        await signInWithEmailAndPassword(auth, email, password);

        // Show success toast
        showToast("Login successful!");
        setTimeout(() => {
          window.location.href = "index.html"; // Redirect to home page
        }, 2000); // Wait 2 seconds before redirecting
      } catch (error) {
        // Handle errors
        if (error.code === "auth/user-not-found") {
          alert("Error: User not found. Please register first.");
        } else if (error.code === "auth/wrong-password") {
          alert("Error: Incorrect password. Please try again.");
        } else {
          alert("Login failed: " + error.message);
        }
      }
    });

    // Toast notification function
    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.classList.add("show");

      // Auto-remove after 3 seconds
      setTimeout(() => {
        toast.classList.remove("show");
      }, 3000);
    }
   
    
  </script>
</body>
</html>
