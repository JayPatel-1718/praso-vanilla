<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Setup Coupons</title>
</head>
<body>
  <h1>Initializing Coupons...</h1>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, setDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC4bDv-5EdzaVbMWd0TVmHLI4y7KIdR-6Q",
      authDomain: "prasoclothing-ac3a3.firebaseapp.com",
      projectId: "prasoclothing-ac3a3",
      storageBucket: "prasoclothing-ac3a3.appspot.com",
      messagingSenderId: "362254349990",
      appId: "1:362254349990:web:b3f89bd304f3468e92e667",
      measurementId: "G-ETY5MMFPPM",
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function initializeCoupons() {
      const coupons = [
        { id: "PRASO10", code: "PRASO10", type: "percent", value: 10, minCart: 1000 },
        { id: "PRASO50", code: "PRASO50", type: "fixed", value: 50, minCart: 2000 },
        { id: "PRASOFREE", code: "PRASOFREE", type: "percent", value: 15, minCart: 5000 }
      ];

      for (const coupon of coupons) {
        await setDoc(doc(db, "coupons", coupon.id), {
          code: coupon.code,
          type: coupon.type,
          value: coupon.value,
          minCart: coupon.minCart
        });
      }
      console.log("Coupons initialized");
      alert("Coupons initialized successfully!");
    }

    initializeCoupons().catch(error => {
      console.error("Error initializing coupons:", error);
      alert("Failed to initialize coupons: " + error.message);
    });
  </script>
</body>
</html>
