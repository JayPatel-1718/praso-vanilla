<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - PRASO</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      /* RESET */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Poppins", sans-serif;
        background: #f5f7fa;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .card {
        background: #ffffff;
        width: 100%;
        max-width: 400px;
        padding: 32px;
        border-radius: 16px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        display: flex;
        flex-direction: column;
        align-items: stretch;
        animation: fadeIn 0.5s ease;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .card h2 {
        text-align: center;
        margin-bottom: 24px;
        font-weight: 600;
        color: #222;
        font-size: 24px;
      }

      form {
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      label {
        font-size: 14px;
        color: #555;
        margin-bottom: 6px;
        display: block;
        font-weight: 500;
      }

      input {
        width: 100%;
        padding: 12px 14px;
        border-radius: 8px;
        border: 1px solid #ccc;
        font-size: 14px;
        outline: none;
        transition: border-color 0.3s;
      }

      input:focus {
        border-color: #111;
      }

      button {
        margin-top: 10px;
        padding: 12px;
        background-color: #111;
        color: #fff;
        font-weight: 600;
        font-size: 15px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: background 0.3s;
      }

      button:hover {
        background-color: #333;
      }

      .link-text {
        margin-top: 20px;
        text-align: center;
        font-size: 14px;
        color: #666;
      }

      .link-text a {
        color: #ff4d4d;
        text-decoration: none;
        font-weight: 600;
        transition: color 0.3s;
      }

      .link-text a:hover {
        color: #ff1a1a;
      }

      .toast {
        position: fixed;
        bottom: 20px;
        right: 20px;
        background-color: #111;
        color: white;
        padding: 12px 20px;
        border-radius: 8px;
        font-size: 14px;
        opacity: 0;
        pointer-events: none;
        transform: translateY(20px);
        transition: all 0.4s ease;
        z-index: 9999;
      }

      .toast.show {
        opacity: 1;
        transform: translateY(0);
        pointer-events: auto;
      }
    </style>
  </head>

  <body>
    <div class="card">
      <h2>Create Account</h2>
      <form id="registerForm">
        <div>
          <label for="name">Name</label>
          <input type="text" id="name" placeholder="Enter your name" required />
        </div>

        <div>
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
          />
        </div>

        <div>
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            placeholder="Create a password"
            required
          />
        </div>

        <button type="submit">Register</button>
      </form>

      <div class="link-text">
        Already have an account? <a href="login.html">Login</a>
      </div>
    </div>

    <div id="toast" class="toast"></div>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
      import {
        getAuth,
        createUserWithEmailAndPassword,
      } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
      import {
        getFirestore,
        doc,
        setDoc,
      } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyC4bDv-5EdzaVbMWd0TVmHLI4y7KIdR-6Q",
        authDomain: "prasoclothing-ac3a3.firebaseapp.com",
        projectId: "prasoclothing-ac3a3",
        storageBucket: "prasoclothing-ac3a3.appspot.com",
        messagingSenderId: "362254349990",
        appId: "1:362254349990:web:b3f89bd304f3468e92e667",
        measurementId: "G-ETY5MMFPPM",
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);

      document
        .getElementById("registerForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const name = document.getElementById("name").value.trim();
          const email = document.getElementById("email").value.trim();
          const password = document.getElementById("password").value;

          try {
            const userCredential = await createUserWithEmailAndPassword(
              auth,
              email,
              password
            );
            const user = userCredential.user;

            await setDoc(doc(db, "users", user.uid), { name, email });

            showToast("Registration successful! Redirecting...");
            setTimeout(() => {
              window.location.href = "login.html";
            }, 2000);
          } catch (error) {
            alert("Registration failed: " + error.message);
          }
        });

      function showToast(message) {
        const toast = document.getElementById("toast");
        toast.textContent = message;
        toast.classList.add("show");
        setTimeout(() => {
          toast.classList.remove("show");
        }, 3000);
      }
    </script>
  </body>
</html>
